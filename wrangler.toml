name = "flookes-hq"
main = "src/worker.js"
compatibility_date = "2026-06-01"

# The app lives at family.flookesitup.com (DNS is on Cloudflare; deploying keeps the record).
workers_dev = true
routes = [
  { pattern = "family.flookesitup.com", custom_domain = true }
]

# One job every 15 minutes. It hands out the day's repeating chores (just after midnight
# Pacific), marks chores missed at their deadline and sends chore reminders. The daily
# pushes (7 AM weather, due-today and payout checks; Sunday 10 AM meal-plan reminder)
# each run once a day at their hour.
[triggers]
crons = ["*/15 * * * *"]

# The app's pages. Every request goes through the Worker first so security headers
# are added and /api/* is checked for sign-in. html_handling = "none" keeps
# /app.html and /index.html at their real addresses (the service worker caches them).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# Everything: family, tasks, bank, meals, shopping list, push subscriptions, sign-ins
[[d1_databases]]
binding = "DB"
database_name = "flookes-hq"
database_id = "9bbb9265-9c6d-4079-b395-9d5291fcdf48"

[observability]
enabled = true

# Secrets — set in the Cloudflare dashboard (Worker → Settings → Variables and Secrets),
# never in this file:
#   ANTHROPIC_API_KEY     – recipe import, meal suggestions, shopping list clean-up
#   GOOGLE_CLIENT_ID      – family Google Calendar
#   GOOGLE_CLIENT_SECRET
#   GOOGLE_REFRESH_TOKEN
# Push notification keys are created by the Worker itself and kept in D1.
